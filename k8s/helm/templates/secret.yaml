{{- if not .Values.auth.existingSecret }}
{{/*
Generated values are read back from the live Secret on upgrade so they stay
stable -- regenerating DJANGO_SECRET_KEY would invalidate every session, and
regenerating MYSQL_PASSWORD would lock the app out of its own database.

Passwords are alphanumeric on purpose: they are interpolated into DATABASE_URL,
where a '@', ':' or '/' would corrupt the URL.
*/}}
{{- $name := include "yoga-flashcards.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secretKey := .Values.django.secretKey }}
{{- if not $secretKey }}
  {{- if and $existing (index $existing.data "DJANGO_SECRET_KEY") }}
    {{- $secretKey = index $existing.data "DJANGO_SECRET_KEY" | b64dec }}
  {{- else }}
    {{- $secretKey = randAlphaNum 50 }}
  {{- end }}
{{- end }}
{{- $mysqlPassword := .Values.auth.mysqlPassword }}
{{- if not $mysqlPassword }}
  {{- if and $existing (index $existing.data "MYSQL_PASSWORD") }}
    {{- $mysqlPassword = index $existing.data "MYSQL_PASSWORD" | b64dec }}
  {{- else }}
    {{- $mysqlPassword = randAlphaNum 24 }}
  {{- end }}
{{- end }}
{{/*
The OpenRouter key follows the same read-back rule, so an operator can set it
once with `kubectl patch secret` and upgrades will not wipe it. Unlike the
others it is never generated: a random string would just fail every call.
*/}}
{{- $openrouterKey := .Values.openrouter.apiKey }}
{{- if not $openrouterKey }}
  {{- if and $existing (index $existing.data "OPENROUTER_API_KEY") }}
    {{- $openrouterKey = index $existing.data "OPENROUTER_API_KEY" | b64dec }}
  {{- end }}
{{- end }}
{{- $mysqlRootPassword := .Values.auth.mysqlRootPassword }}
{{- if not $mysqlRootPassword }}
  {{- if and $existing (index $existing.data "MYSQL_ROOT_PASSWORD") }}
    {{- $mysqlRootPassword = index $existing.data "MYSQL_ROOT_PASSWORD" | b64dec }}
  {{- else }}
    {{- $mysqlRootPassword = randAlphaNum 24 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "yoga-flashcards.labels" . | nindent 4 }}
type: Opaque
data:
  DJANGO_SECRET_KEY: {{ $secretKey | b64enc | quote }}
  MYSQL_PASSWORD: {{ $mysqlPassword | b64enc | quote }}
  MYSQL_ROOT_PASSWORD: {{ $mysqlRootPassword | b64enc | quote }}
{{- if $openrouterKey }}
  OPENROUTER_API_KEY: {{ $openrouterKey | b64enc | quote }}
{{- end }}
{{- end }}
