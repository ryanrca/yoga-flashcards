apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yoga-flashcards.fullname" . }}-config
  labels:
    {{- include "yoga-flashcards.labels" . | nindent 4 }}
data:
  DEBUG: {{ ternary "1" "0" .Values.django.debug | quote }}
  DJANGO_ALLOWED_HOSTS: {{ include "yoga-flashcards.allowedHosts" . | quote }}
  # Same origin serves the SPA and the API, so these each hold one entry.
  CORS_ALLOWED_ORIGINS: {{ include "yoga-flashcards.origin" . | quote }}
  CSRF_TRUSTED_ORIGINS: {{ include "yoga-flashcards.origin" . | quote }}
  CSRF_COOKIE_SECURE: {{ ternary "1" "0" .Values.secureCookies | quote }}
  SESSION_COOKIE_SECURE: {{ ternary "1" "0" .Values.secureCookies | quote }}
  CSRF_COOKIE_SAMESITE: "Lax"
  SESSION_COOKIE_SAMESITE: "Lax"
  USE_X_FORWARDED_PROTO: {{ ternary "1" "0" .Values.proxy.useXForwardedProto | quote }}
  USE_X_FORWARDED_HOST: {{ ternary "1" "0" .Values.proxy.useXForwardedHost | quote }}
  MEDIA_ROOT: {{ .Values.backend.media.mountPath | quote }}
  # OpenRouter, non-secret settings only. The API key is in the Secret and is
  # mounted into the image bot alone, not the web pods, which never call out.
  OPENROUTER_BASE_URL: {{ .Values.openrouter.baseUrl | quote }}
  OPENROUTER_TIMEOUT: {{ .Values.openrouter.timeout | quote }}
  OPENROUTER_SITE_URL: {{ .Values.openrouter.siteUrl | default (include "yoga-flashcards.origin" .) | quote }}
  OPENROUTER_SITE_NAME: {{ .Values.openrouter.siteName | quote }}
