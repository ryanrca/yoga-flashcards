{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled .Values.ingress.certManager.enabled .Values.ingress.certManager.createIssuer }}
{{/*
A per-namespace Issuer, not a ClusterIssuer: that is the pattern every other
namespace on this cluster uses, and there is no ClusterIssuer to borrow.
*/}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.ingress.certManager.issuerName }}
  labels:
    {{- include "yoga-flashcards.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.ingress.certManager.email | quote }}
    server: {{ .Values.ingress.certManager.server | quote }}
    privateKeySecretRef:
      name: letsencrypt-issuer-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.className }}
{{- end }}
