server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Probes hit this; it must not depend on the SPA bundle.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on stale JS.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Routing is hash-based, so the server only ever sees "/". The fallback is
    # here so a stray deep path still lands on the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
